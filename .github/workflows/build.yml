name: FAN SUPER Build

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11 (Chaquopy derleme için)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Python meclisi testi
        run: |
          pip install "numpy<2"
          cd app/src/main/python
          python - <<'PY'
          import json, fan_super as fs
          v=[i%4 for i in range(120)]; t=[1700000000+i for i in range(120)]
          fs.configure(json.dumps({"window":100}))
          r=json.loads(fs.replay(json.dumps(v), json.dumps(t)))
          assert len(r["per"])==120 and len(r["next"])==4
          fs.step(1, 1700000200); assert fs.undo()!=""
          print("Python meclisi OK", fs.info())
          PY

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: APK adını düzenle
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/FAN_SUPER_v1.0_build${{ github.run_number }}.apk
          ls -la out

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: FAN_SUPER_APK
          path: out/*.apk

      - name: Release (main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FAN SUPER v1.0 (build ${{ github.run_number }})
          body: "Telefona kurmak için aşağıdaki APK dosyasını indirin."
          files: out/*.apk
